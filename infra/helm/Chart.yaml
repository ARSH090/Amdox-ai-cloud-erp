# infra/helm/Chart.yaml
apiVersion: v2
name: amdox-erp
description: A Helm chart for deploying the AMDOX ERP platform on Kubernetes
type: application
version: 1.0.0
appVersion: "4.2.0"
dependencies:
  - name: postgresql
    version: "15.2.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
