packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@apollo/protobufjs"
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "msgpackr-extract"
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  sharp: true
  prisma: true
  msgpackr-extract: true
