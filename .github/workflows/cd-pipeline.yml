name: AMDOX ERP // DevOps CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up QEMU for multi-platform build
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Google Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: us-east1-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    - name: Install Cosign CLI
      uses: sigstore/cosign-installer@v3.5.0

    - name: Build and Push Multi-Platform Container
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/api/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/amdox-registry/api-monolith:${{ github.sha }}
          us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/amdox-registry/api-monolith:latest

    - name: Sign the Published Container Image
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --key env://COSIGN_PRIVATE_KEY \
          us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/amdox-registry/api-monolith:${{ github.sha }}

    - name: Checkout ArgoCD GitOps Repository
      uses: actions/checkout@v4
      with:
        repository: amdox-technologies/amdox-gitops-infra
        token: ${{ secrets.GITOPS_GITHUB_TOKEN }}
        path: gitops-infra

    - name: Execute GitOps sed tag update
      run: |
        cd gitops-infra
        sed -i 's|image: us-east1-docker.pkg.dev/.*|image: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/amdox-registry/api-monolith:${{ github.sha }}|g' deployments/api-deployment.yaml
        git config user.name "AMDOX DevOps Bot"
        git config user.email "devops@amdox.com"
        git add deployments/api-deployment.yaml
        git commit -m "gitops(cd): auto-upgrade api-monolith image tag to ${{ github.sha }} [skip ci]"
        git push origin main
