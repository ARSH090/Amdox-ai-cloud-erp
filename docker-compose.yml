# ═══════════════════════════════════════════════════════════════════════════
# AMDOX ERP — Production Docker Compose Orchestration Matrix
# Orchestrates: PostgreSQL 17, Redis 8, Keycloak 25, Elasticsearch 8,
#               NestJS API, Next.js Frontend, FastAPI ML Service
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Primary PostgreSQL Transaction Database ──────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: amdox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amdox_db}
      POSTGRES_USER: ${POSTGRES_USER:-amdox_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amdox_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amdox_admin} -d ${POSTGRES_DB:-amdox_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── Redis Cache & Queue Broker ──────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    container_name: amdox-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-amdox_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-amdox_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── Keycloak OIDC/SAML Identity Provider ────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: amdox-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-amdox_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-amdox_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-amdox_secure_password}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── Elasticsearch Document Index Engine ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: amdox-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-amdox_elastic_pass}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:${ELASTIC_PASSWORD:-amdox_elastic_pass} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── NestJS API Service ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: amdox-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-amdox_admin}:${POSTGRES_PASSWORD:-amdox_secure_password}@postgres:5432/${POSTGRES_DB:-amdox_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-amdox_redis_pass}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-amdox-erp}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-amdox-secret}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── Next.js Frontend Service ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: amdox-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - amdox-internal

  # ── FastAPI ML Forecasting Service ──────────────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    container_name: amdox-ml
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-amdox_admin}:${POSTGRES_PASSWORD:-amdox_secure_password}@postgres:5432/${POSTGRES_DB:-amdox_db}
    ports:
      - "${ML_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - amdox-internal

networks:
  amdox-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  esdata:
    driver: local
